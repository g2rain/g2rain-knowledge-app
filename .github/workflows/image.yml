name: Publish container image

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read
  packages: write

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate stable tag, release source, and project version
        id: image
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an exact stable tag: v<major>.<minor>.<patch>." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag '$GITHUB_REF_NAME' does not point to a commit in origin/main history." >&2
            exit 1
          fi
          if ! git cat-file -e "$tag_commit:docs/releases/$GITHUB_REF_NAME.md"; then
            echo "Missing release notes at the tagged commit: docs/releases/$GITHUB_REF_NAME.md." >&2
            exit 1
          fi
          if [[ -z "$(git show "$tag_commit:docs/releases/$GITHUB_REF_NAME.md" | tr -d '[:space:]')" ]]; then
            echo "Release notes at the tagged commit are empty." >&2
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not match package.json version '$version'." >&2
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Build and type-check
        run: npm run build
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build image
        env:
          DOCKER_BUILDKIT: '1'
        shell: bash
        run: |
          docker build \
            --build-arg VITE_BUILD_MODE=production \
            --build-arg IMAGE_VERSION="${{ steps.image.outputs.version }}" \
            --build-arg VCS_REF="${{ steps.image.outputs.commit }}" \
            --tag "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" \
            --tag "${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}" \
            .
      - name: Push both immutable image tags
        shell: bash
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}"
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}"
      - name: Report published image
        shell: bash
        run: |
          {
            echo '## GHCR image published'
            echo
            echo "- \`${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}\`"
            echo "- \`${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
